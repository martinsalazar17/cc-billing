<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="CC Billing Statement — University of San Carlos Finance">
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
  <meta property="og:title" content="CC Billing Statement">
  <meta property="og:description" content="Credit card billing statement portal — USC Finance Division">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cc.alvinsalazar.com">
  <title>CC Billing — USC Finance</title>

  <!-- Favicon: Jet Black background, Ash "CC" -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1a1a'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui%2C sans-serif' font-size='13' font-weight='800' fill='%23bfbfbf' letter-spacing='-0.5'%3ECC%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231a1a1a'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui%2C sans-serif' font-size='72' font-weight='800' fill='%23bfbfbf'%3ECC%3C/text%3E%3C/svg%3E">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: system-ui, -apple-system, sans-serif; }

    #loader {
      position: fixed; inset: 0; z-index: 10;
      background: linear-gradient(150deg, #0d0d0d 0%, #1a1a1a 50%, #222526 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity .4s ease, visibility .4s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .ld-logo {
      width: 64px; height: 64px; border-radius: 18px;
      background: linear-gradient(135deg, #353a3e, #222526);
      border: 1.5px solid rgba(255,255,255,.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; color: #e0e0e0; letter-spacing: -.04em;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
      animation: popIn .5s cubic-bezier(.34,1.5,.64,1) both;
    }
    @keyframes popIn { from { opacity:0; transform:scale(.6) } to { opacity:1; transform:scale(1) } }

    .ld-name { font-size: 22px; font-weight: 800; color: #e0e0e0; letter-spacing: -.04em; margin-bottom: 4px; }
    .ld-sub  { font-size: 11px; color: rgba(191,191,191,.45); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 32px; }

    .ld-dots { display: flex; gap: 6px; }
    .ld-dots span {
      width: 8px; height: 8px; border-radius: 50%;
      background: #bfbfbf;
      animation: ldot 1.2s ease-in-out infinite;
    }
    .ld-dots span:nth-child(2) { animation-delay: .18s; opacity: .5; }
    .ld-dots span:nth-child(3) { animation-delay: .36s; opacity: .25; }
    @keyframes ldot { 0%,80%,100%{transform:scale(.5);opacity:.25} 40%{transform:scale(1);opacity:1} }

    #gasFrame {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: none; opacity: 0; transition: opacity .35s ease;
    }
    #gasFrame.ready { opacity: 1; }
  </style>
</head>
<body>
  <div id="loader">
    <div class="ld-logo">CC</div>
    <div class="ld-name">CC Billing</div>
    <div class="ld-sub">USC Finance Division</div>
    <div class="ld-dots"><span></span><span></span><span></span></div>
  </div>

  <iframe
    id="gasFrame"
    src="https://script.google.com/macros/s/AKfycbw6UjkLIwQB8BrVzgknh7SyWK5W5ggik-V6aFarRY62q-A7iTxv_EJ6HzbDA9-fSwZ_5g/exec"
    allow="clipboard-read; clipboard-write"
    loading="eager"
    title="CC Billing Statement"
    onload="onFrameLoad()"
  ></iframe>

  <script>
    var MIN_SPLASH = 1200, loadedAt = null, splashShown = Date.now();
    function onFrameLoad(){
      loadedAt = Date.now();
      setTimeout(dismissLoader, Math.max(0, MIN_SPLASH - (loadedAt - splashShown)));
    }
    function dismissLoader(){
      document.getElementById('gasFrame').classList.add('ready');
      document.getElementById('loader').classList.add('hidden');
    }
    setTimeout(function(){ if(!loadedAt) dismissLoader(); }, 8000);
  </script>
</body>
</html>
