<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#063a40">
  <meta name="description" content="CC Billing Statement — University of San Carlos Finance">
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no">

  <!-- Open Graph -->
  <meta property="og:title" content="CC Billing Statement">
  <meta property="og:description" content="Credit card billing statement portal — USC Finance Division">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cc.alvinsalazar.com">

  <title>CC Billing — USC Finance</title>

  <!-- Favicon: inline SVG data URI — teal "CC" mark -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23063a40'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='DM Sans%2C system-ui%2C sans-serif' font-size='13' font-weight='800' fill='%232a9d8f' letter-spacing='-0.5'%3ECC%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23063a40'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui%2C sans-serif' font-size='72' font-weight='800' fill='%232a9d8f'%3ECC%3C/text%3E%3C/svg%3E">

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #063a40;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* ── Loading screen — shown until iframe fires onload ── */
    #loader {
      position: fixed; inset: 0; z-index: 10;
      background: linear-gradient(150deg, #031e22 0%, #052e34 50%, #063a40 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0;
      transition: opacity .4s ease, visibility .4s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .ld-logo {
      width: 64px; height: 64px; border-radius: 18px;
      background: linear-gradient(135deg, #3dbdad, #1f7d72);
      border: 1.5px solid rgba(255,255,255,.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -.04em;
      box-shadow: 0 8px 32px rgba(42,157,143,.50), 0 2px 8px rgba(0,0,0,.35);
      margin-bottom: 16px;
      animation: popIn .5s cubic-bezier(.34,1.5,.64,1) both;
    }
    @keyframes popIn { from { opacity:0; transform:scale(.6) } to { opacity:1; transform:scale(1) } }

    .ld-name {
      font-size: 22px; font-weight: 800; color: #e2f4f5;
      letter-spacing: -.04em; margin-bottom: 4px;
    }
    .ld-sub {
      font-size: 11px; color: rgba(178,228,232,.45);
      letter-spacing: .14em; text-transform: uppercase;
      margin-bottom: 32px;
    }

    /* Animated teal dots */
    .ld-dots { display: flex; gap: 6px; }
    .ld-dots span {
      width: 8px; height: 8px; border-radius: 50%;
      background: #2a9d8f;
      animation: ldot 1.2s ease-in-out infinite;
    }
    .ld-dots span:nth-child(2) { animation-delay: .18s; opacity: .6; }
    .ld-dots span:nth-child(3) { animation-delay: .36s; opacity: .3; }
    @keyframes ldot {
      0%,80%,100% { transform: scale(.5); opacity: .3; }
      40%          { transform: scale(1);  opacity: 1;  }
    }

    /* ── The iframe fills everything ── */
    #gasFrame {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: none;
      /* keep it hidden until loaded so the loader covers it */
      opacity: 0;
      transition: opacity .35s ease;
    }
    #gasFrame.ready { opacity: 1; }
  </style>
</head>
<body>

  <!-- Loading splash -->
  <div id="loader">
    <div class="ld-logo">CC</div>
    <div class="ld-name">CC Billing</div>
    <div class="ld-sub">USC Finance Division</div>
    <div class="ld-dots"><span></span><span></span><span></span></div>
  </div>

  <!-- GAS app iframe -->
  <iframe
    id="gasFrame"
    src="https://script.google.com/macros/s/AKfycbw6UjkLIwQB8BrVzgknh7SyWK5W5ggik-V6aFarRY62q-A7iTxv_EJ6HzbDA9-fSwZ_5g/exec"
    allow="clipboard-read; clipboard-write"
    loading="eager"
    title="CC Billing Statement"
    onload="onFrameLoad()"
  ></iframe>

  <script>
    // Minimum splash time (ms) so the loader doesn't flash too briefly
    var MIN_SPLASH = 1200;
    var loadedAt   = null;
    var splashShown = Date.now();

    function onFrameLoad() {
      loadedAt = Date.now();
      var elapsed = loadedAt - splashShown;
      var delay   = Math.max(0, MIN_SPLASH - elapsed);
      setTimeout(dismissLoader, delay);
    }

    function dismissLoader() {
      var frame  = document.getElementById('gasFrame');
      var loader = document.getElementById('loader');
      frame.classList.add('ready');
      loader.classList.add('hidden');
    }

    // Safety fallback — dismiss after 8 s regardless (handles iframe
    // load events that don't fire on cross-origin navigations)
    setTimeout(function() {
      if (!loadedAt) dismissLoader();
    }, 8000);
  </script>

</body>
</html>
