    <meta charset="UTF-8">
    <!--
      FOUC GUARD — runs synchronously before first paint.
      Reads the last theme the app told us about (cached from a
      previous successful postMessage) and applies it immediately,
      so the very first frame is already correctly colored instead
      of falling back to the hardcoded #000000 default while we
      wait for the iframe to load and hand-shake with us again.
    -->
    <script>
        (function(){
            try {
                var t = localStorage.getItem('sintaputo_theme');
                if (t === 'light' || t === 'dark') {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) {}
        })();
    </script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /*
          EDGE-TO-EDGE CANVAS
          - 100dvh, not 100%, so the layout tracks the real dynamic
            viewport (address bar hidden/shown, home indicator, etc.)
          - explicit background-color on html AND body so there is
            never a frame where the browser's own white default is
            what's visible (before paint, during theme transition,
            or if the iframe hasn't loaded yet).
          - --bg is a variable, not a hardcoded value, so the same
            two rules serve both themes; JS below flips it.
        */
        html, body {
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            margin: 0;
            padding: 0;
            /* Belt-and-suspenders: if 100dvh ever falls short of the true
               viewport on a given iOS build, whatever sliver of body shows
               below the fixed iframe is still themed correctly instead of
               exposing raw canvas. */
            padding-bottom: env(safe-area-inset-bottom, 0px);
            overflow: hidden;
            background: var(--bg, #000000);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        html[data-theme="light"] { --bg: #f2f2f7; }
        html[data-theme="dark"]  { --bg: #000000; }

        /*
          SCROLL-UNDER IFRAME
          Fixed + inset:0 + 100dvh so the iframe's own box always
          spans the full physical screen, home indicator included,
          exactly like Instagram's feed extending under its pill nav.
        */
        #gasFrame {
            position: fixed;
            inset: 0;
            width: 100%;
            /* 100dvh is the starting guess only. Several mobile WebViews
               (iOS standalone PWA, some Android Chrome/WebView builds)
               under-report dvh and leave a sliver of the real viewport
               uncovered at the bottom, which exposes this page's own
               background behind the iframe. JS below measures the true
               visual viewport in pixels and overrides this on load and
               on every resize, so the iframe always reaches the real
               edge regardless of a given browser's dvh support. */
            height: 100dvh;
            border: none;
            opacity: 0;
            transition: opacity .35s ease;
        }
        #gasFrame.ready { opacity: 1; }

          ORIGIN HANDLING
          A GAS /exec URL is a REDIRECT — the iframe's actual document
          ends up served from a sandboxed *.googleusercontent.com
          origin (something like n-xxxxxxxx.script.googleusercontent.com),
          not from script.google.com itself. Matching postMessage
          origins against the literal script.google.com string means
          the check silently fails 100% of the time and every message
          from the child (theme changes, etc.) gets dropped — which is
          what was causing the wrapper to stay stuck on its hardcoded
          black fallback regardless of the app's actual theme.

          Fix: accept messages from either the pre-redirect host or
          the *.googleusercontent.com sandbox host, and remember the
          child's real origin the first time we see it so outgoing
          messages can target it precisely from then on.

        var childOrigin = null; // learned from the first trusted message we receive

            if (!origin) return false;
            if (origin === GAS_EXEC_ORIGIN) return true;
            try {
                var host = new URL(origin).hostname;
                return /\.googleusercontent\.com$/.test(host);
            } catch (e) {
                return false;
            }
        }

        // Target origin for messages we SEND to the iframe. Before we've
        // heard from the child at least once we don't know its exact
        // sandboxed origin, so we fall back to '*' for those first couple
        // of pings only (the payloads — a pixel value and a theme
        // request — carry nothing sensitive). Once childOrigin is known,
        // every send after that is precisely targeted.
        function frameTargetOrigin(){
            return childOrigin || '*';
        }

        /*
          REAL VIEWPORT HEIGHT (dvh FALLBACK FIX)
          Measures the true visual viewport in pixels and applies it
          directly to #gasFrame's inline style, overriding the CSS
          100dvh guess. Re-measures on resize, orientation change, and
          visualViewport resize (covers on-screen keyboard, browser
          chrome show/hide, and the standalone-PWA home-indicator cases
          where dvh alone came up short and exposed a strip of this
          page's own background underneath the iframe).
        */
        function setFrameHeight(){
            var frame = document.getElementById('gasFrame');
            if (!frame) return;
            var h = (window.visualViewport && window.visualViewport.height)
                ? window.visualViewport.height
                : window.innerHeight;
            frame.style.height = h + 'px';
        }
        setFrameHeight();
        window.addEventListener('resize', setFrameHeight);
        window.addEventListener('orientationchange', function(){ setTimeout(setFrameHeight, 150); });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', setFrameHeight);
        }

        var MIN_SPLASH = 1400, loadedAt = null, splashShown = Date.now();

        function onFrameLoad(){
            loadedAt = Date.now();
            setTimeout(dismissLoader, Math.max(0, MIN_SPLASH - (loadedAt - splashShown)));
            sendSafeArea(); // push the real safe-area value in as soon as the child exists
            requestTheme(); // ask the app what theme it's actually in, in case its
                             // own startup message raced ahead of this listener
        }
        function requestTheme(){
            var frame = document.getElementById('gasFrame');
            if (!frame || !frame.contentWindow) return;
            frame.contentWindow.postMessage({ type: 'sintaputo-request-theme' }, frameTargetOrigin());
        }
        function dismissLoader(){
            document.getElementById('gasFrame').classList.add('ready');
            document.getElementById('loader').classList.add('hidden');
        }
        setTimeout(function(){ if(!loadedAt) dismissLoader(); }, 8000);

        /*
          SAFE-AREA BRIDGE
          The top-level document is the only place iOS reliably
          reports env(safe-area-inset-*). We measure it here with a
          throwaway probe element, then push the pixel value into
          the iframe's document via postMessage so its CSS can use
          the real number instead of an env() call that evaluates
          to 0 inside a cross-origin frame.
        */
        function measureSafeAreaBottom(){
            var probe = document.createElement('div');
            probe.style.cssText = 'position:fixed;bottom:0;height:0;padding-bottom:env(safe-area-inset-bottom, 0px);visibility:hidden;pointer-events:none;';
            document.body.appendChild(probe);
            var px = parseFloat(getComputedStyle(probe).paddingBottom) || 0;
            document.body.removeChild(probe);
            return px;
        }
        function sendSafeArea(){
            var frame = document.getElementById('gasFrame');
            if (!frame || !frame.contentWindow) return;
            frame.contentWindow.postMessage(
                { type: 'sintaputo-safe-area', bottom: measureSafeAreaBottom() },
                frameTargetOrigin()
            );
        }
        window.addEventListener('resize', sendSafeArea);
        window.addEventListener('orientationchange', function(){ setTimeout(sendSafeArea, 150); });

        /*
          THEME BRIDGE
          The light/dark toggle lives inside the iframe (it's the
          app's own UI). When the user flips it, the app posts the
          new theme up to us so the OUTER canvas — the html/body
          background and the native theme-color meta — stays in
          sync. Without this, only the content inside the iframe
          would change color; the edges of the screen would still
          show the old theme's background.
        */
        window.addEventListener('message', function(e){
            if (!isTrustedOrigin(e.origin)) return;
            // Remember the child's real origin so future sends target it
            // precisely instead of relying on '*'.
            childOrigin = e.origin;
            if (e.data && e.data.type === 'sintaputo-theme') {
                var theme = e.data.theme === 'light' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
                document.getElementById('themeColorMeta').setAttribute(
                    'content', theme === 'light' ? '#f2f2f7' : '#000000'
                );
                // Cache it so the FOUC guard can apply it instantly on
                // the very next load, before the iframe even exists.
                try { localStorage.setItem('sintaputo_theme', theme); } catch (err) {}
            }
        });
    </script>
</body>
</html>
